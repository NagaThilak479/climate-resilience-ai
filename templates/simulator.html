<!DOCTYPE html>
<html>
<head>
    <title>Climate Simulator</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tsparticles@2/tsparticles.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>

<nav>
    <a href="/">Home</a>
    <a href="/simulator">Simulator</a>
</nav>

<h1 class="fade-down"> Climate Resilience Simulator</h1>

<form id="predictForm" class="form-card">
    <input type="number" name="temperature" placeholder="Temperature (°C)" required>
    <input type="number" name="rainfall" placeholder="Rainfall (mm)" required>
    <input type="number" name="population_density" placeholder="Population Density" required>

    <button type="submit" class="large-btn">Predict Resilience</button>
</form>
<!-- Loading Spinner -->
<div id="loader" class="loader"></div>

<script src="{{ url_for('static', filename='script.js') }}"></script>
<div class="result-wrapper">

    <div class="result-card">

        <div class="gauge-container">
            <div class="gauge-circle">
                <span id="scoreValue">83.09%</span>
            </div>
        </div>

        <h2 id="resultStatus">High Resilience – Strong Stability</h2>

        <p class="confidence">
            AI Confidence: <span id="confidenceValue">92%</span>
        </p>

        <div class="actions-section">
            <h3>Recommended Actions</h3>
            <ul id="actionsList"></ul>
        </div>

        <div class="result-buttons">
            <button onclick="downloadPDF()" class="btn big-btn">
                Download PDF Report
            </button>
            <button onclick="shareResult()" class="btn secondary-btn">
                Share Result
            </button>
        </div>

    </div>

</div>

</body>
</html>
